services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-p2p_lending}
      POSTGRES_USER: ${POSTGRES_USER:-p2p}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"        # Power BI Desktop (Windows host) reaches http://localhost:8000
    volumes:
      - media:/app/backend/media
      - static:/app/backend/staticfiles
      - ./data:/app/data   # raw/processed datasets (not baked into the image)
    networks: [backend]

volumes:
  pgdata:
  media:
  static:

networks:
  backend:
